apis:
- name: FOSSA REST API
  description: >-
    The FOSSA REST API lets you build integrations and automate open source
    management workflows — manage projects, revisions, issues, users and teams,
    release groups, and reports; initiate binary scans; download attribution
    reports; and query the vulnerability database by CPE. Authenticates with an
    API token in the Authorization Bearer header over HTTPS.
