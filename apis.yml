aid: fossa
name: Fossa
description: >-
  FOSSA is a software supply chain security and open source management platform
  that scans codebases, containers, and binaries to detect open source
  dependencies, then enforces open source license compliance, vulnerability
  management, and SBOM (CycloneDX/SPDX) obligations across the software
  development lifecycle. FOSSA exposes a REST API at app.fossa.com/api plus the
  language-agnostic FOSSA CLI, integrating with 20+ build systems and CI/CD to
  surface licensing, security, and quality issues, generate attribution and
  audit reports, and gate pull requests on policy violations. Backed by Bain
  Capital Ventures and Norwest Venture Partners.
